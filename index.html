<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Chess Review</title>

  <!-- Chessboard.js styling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333333;
      --accent: #4ade80;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --blunder: #ef4444;
      --best: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

    header { text-align: center; margin-bottom: 4px; }
    header h1 { font-size: 1.3rem; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; margin-bottom: 8px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }

    button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; background: var(--accent); color: #000; }
    button:active { opacity: 0.8; }

    #board-wrapper { width: 100%; max-width: 400px; margin: 0 auto; }

    .nav-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .nav-btn { background: #2a2a2a; color: #fff; font-size: 1.1rem; padding: 8px 0; border: 1px solid var(--border); border-radius: 6px; }

    .analysis-card { display: flex; flex-direction: column; gap: 6px; text-align: center; }
    .move-status { font-size: 1rem; font-weight: 700; }
    .move-detail { font-size: 0.85rem; color: var(--text-muted); }

    .sandbox-toggle { background: #2563eb; color: #fff; margin-top: 4px; }
    .sandbox-active { background: #ea580c; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>♟️ Pocket Review</h1>
    <p>Auto-analyzed games powered by Stockfish</p>
  </header>

  <!-- Setup Bar -->
  <div class="card" id="config-panel">
    <label>Database URL</label>
    <input type="text" id="db-url" placeholder="https://your-app-default-rtdb.firebaseio.com" />
    <label>Chess.com Username</label>
    <input type="text" id="username" placeholder="e.g. your_username" />
    <button id="load-games-btn">Load Analyzed Games</button>
  </div>

  <!-- Game Selector -->
  <div class="card" id="game-panel" style="display: none;">
    <label>Select Game</label>
    <select id="game-select"></select>
  </div>

  <!-- Interactive Board -->
  <div class="card">
    <div id="board-wrapper">
      <div id="board" style="width: 100%"></div>
    </div>

    <!-- Move Navigation -->
    <div class="nav-controls">
      <button class="nav-btn" id="btn-start">|◀</button>
      <button class="nav-btn" id="btn-prev">◀</button>
      <button class="nav-btn" id="btn-next">▶</button>
      <button class="nav-btn" id="btn-end">▶|</button>
    </div>
  </div>

  <!-- Move Analysis Box -->
  <div class="card analysis-card">
    <div class="move-status" id="status-title">Start of Game</div>
    <div class="move-detail" id="status-desc">Use arrows to step through moves.</div>
    <button class="sandbox-toggle" id="sandbox-btn">🎮 Play / Practice From Here</button>
  </div>
</div>

<!-- Libraries via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
  let gamesData = {};
  let currentMoves = [];
  let currentStep = 0;
  let isSandbox = false;

  const game = new Chess();
  const board = Chessboard('board', {
    draggable: false,
    position: 'start',
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
  });

  // 1. Local Storage Persistence
  const savedUrl = localStorage.getItem('chess_db_url');
  const savedUser = localStorage.getItem('chess_user');
  if (savedUrl) document.getElementById('db-url').value = savedUrl;
  if (savedUser) document.getElementById('username').value = savedUser;

  // 2. Fetch Games directly from Firebase via REST
  document.getElementById('load-games-btn').addEventListener('click', async () => {
    let dbUrl = document.getElementById('db-url').value.trim().replace(/\/$/, "");
    const user = document.getElementById('username').value.trim();

    if (!dbUrl || !user) {
      alert("Please fill in both Database URL and Username.");
      return;
    }

    localStorage.setItem('chess_db_url', dbUrl);
    localStorage.setItem('chess_user', user);

    const btn = document.getElementById('load-games-btn');
    btn.innerText = "Loading...";

    try {
      const res = await fetch(`${dbUrl}/users/${user}/games.json`);
      gamesData = await res.json();

      if (!gamesData) {
        alert("No games found yet! Have you run the GitHub Actions workflow?");
        btn.innerText = "Load Analyzed Games";
        return;
      }

      const select = document.getElementById('game-select');
      select.innerHTML = '';
      Object.keys(gamesData).reverse().forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.innerText = `Game ID: ${id} (${gamesData[id].moves ? gamesData[id].moves.length : 0} moves)`;
        select.appendChild(opt);
      });

      document.getElementById('game-panel').style.display = 'block';
      loadSelectedGame();
      btn.innerText = "Refreshed!";
      setTimeout(() => btn.innerText = "Load Analyzed Games", 1500);
    } catch (err) {
      alert("Failed to connect to Firebase. Check your URL and database rules.");
      console.error(err);
      btn.innerText = "Load Analyzed Games";
    }
  });

  document.getElementById('game-select').addEventListener('change', loadSelectedGame);

  function loadSelectedGame() {
    const selectedId = document.getElementById('game-select').value;
    const g = gamesData[selectedId];
    if (!g || !g.moves) return;

    currentMoves = g.moves;
    currentStep = 0;
    exitSandbox();
    goToMove(0);
  }

  function goToMove(index) {
    if (index < 0 || index > currentMoves.length) return;
    currentStep = index;

    if (currentStep === 0) {
      game.reset();
      board.position(game.fen());
      updateAnalysis("Start of Game", "Tap ▶ to begin analysis.");
      return;
    }

    const moveData = currentMoves[currentStep - 1];
    
    // Set board to state after played move
    game.load(moveData.fen_before);
    game.move(moveData.played, { sloppy: true });
    board.position(game.fen());

    // Highlight evaluation
    const played = moveData.played;
    const best = moveData.best_move;

    if (!best || played === best) {
      updateAnalysis("✅ Best / Good Move", `Played: ${played}`, "var(--best)");
    } else {
      updateAnalysis("⚠️ Missed Better Move", `You played: ${played} | Stockfish: ${best}`, "var(--blunder)");
    }
  }

  function updateAnalysis(title, desc, color = "var(--text)") {
    const titleEl = document.getElementById('status-title');
    titleEl.innerText = title;
    titleEl.style.color = color;
    document.getElementById('status-desc').innerText = desc;
  }

  // Navigation Click Handlers
  document.getElementById('btn-start').onclick = () => { if (!isSandbox) goToMove(0); };
  document.getElementById('btn-prev').onclick = () => { if (!isSandbox) goToMove(currentStep - 1); };
  document.getElementById('btn-next').onclick = () => { if (!isSandbox) goToMove(currentStep + 1); };
  document.getElementById('btn-end').onclick = () => { if (!isSandbox) goToMove(currentMoves.length); };

  // 3. "Play From Here" Sandbox Feature
  const sandboxBtn = document.getElementById('sandbox-btn');
  sandboxBtn.onclick = () => {
    if (isSandbox) {
      exitSandbox();
      goToMove(currentStep);
    } else {
      enterSandbox();
    }
  };

  function enterSandbox() {
    isSandbox = true;
    sandboxBtn.innerText = "🛑 Exit Practice Mode";
    sandboxBtn.classList.add('sandbox-active');
    updateAnalysis("Sandbox Active", "Drag pieces to try alternative moves.", "var(--accent)");

    // Enable dragging
    board.destroy();
    window.sandboxBoard = Chessboard('board', {
      draggable: true,
      position: game.fen(),
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDrop: (source, target) => {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        updateAnalysis("You played: " + move.san, "Engine line sandbox.");
      }
    });
  }

  function exitSandbox() {
    isSandbox = false;
    sandboxBtn.innerText = "🎮 Play / Practice From Here";
    sandboxBtn.classList.remove('sandbox-active');

    if (window.sandboxBoard) {
      window.sandboxBoard.destroy();
    }
    board.destroy();
    window.board = Chessboard('board', {
      draggable: false,
      position: game.fen(),
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });
  }
</script>
</body>
</html>
