<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Chess Analytics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F19; --surface: #151C2C; --surface-hover: #1E293B; 
      --border: #2A3441; --text-main: #F8FAFC; --text-muted: #94A3B8;
      --accent: #3B82F6; --best: #10B981; --blunder: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; background: var(--bg); }
    
    header { padding: 20px; background: var(--bg); }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .tabs { display: flex; margin-top: 15px; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }
    
    .btn-primary { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; background: var(--accent); color: #fff; margin-bottom: 16px; }
    
    .match-header { background: var(--surface); padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.85rem; }
    .player-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { background: var(--surface); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

    .board-container { display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; }
    #eval-bar { width: 16px; background: #333; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--border); }
    #eval-fill { background: #fff; width: 100%; height: 50%; transition: height 0.3s ease; }
    #board-wrapper { flex: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    
    .highlight-square { box-shadow: inset 0 0 3px 3px rgba(59, 130, 246, 0.6); }

    .nav-controls { display: grid; grid-template-columns: repeat(4, 1fr) 1.2fr; gap: 6px; margin-bottom: 12px; }
    .nav-btn { background: var(--surface); color: var(--text-main); padding: 12px 0; border: 1px solid var(--border); border-radius: 8px; font-weight: 600; cursor: pointer; }
    .play-sandbox-btn { background: var(--best); color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

    .analysis-box { background: var(--surface); padding: 14px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
    .move-status { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .move-detail { font-size: 0.85rem; color: var(--text-muted); }

    .game-card { background: var(--surface); padding: 14px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .game-title { font-weight: 600; font-size: 0.9rem; }
    .game-meta { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>♟️ Pro Chess Analytics</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('profile')">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('analysis')">Analysis Board</button>
    </div>
  </header>

  <div id="profile" class="tab-content active">
    <div style="display: none;">
      <input type="text" id="db-url" value="https://chess-analyzer-36eb6-default-rtdb.firebaseio.com" />
      <input type="text" id="username" value="forgotten_gambit" />
    </div>
    <button class="btn-primary" id="load-btn">Sync Recent Games</button>
    <div id="game-list" class="game-list"></div>
  </div>

  <div id="analysis" class="tab-content">
    <div class="match-header">
      <span id="white-player">White: -</span>
      <span id="black-player">Black: -</span>
    </div>

    <div class="player-stats">
      <div class="stat-box">
        <div class="stat-val" id="white-acc">-</div>
        <div class="stat-lbl">White Accuracy</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="black-acc">-</div>
        <div class="stat-lbl">Black Accuracy</div>
      </div>
    </div>

    <div class="board-container">
      <div id="eval-bar"><div id="eval-fill"></div></div>
      <div id="board-wrapper"><div id="board" style="width: 100%"></div></div>
    </div>
    
    <div class="nav-controls">
      <button class="nav-btn" onclick="goToMove(0)">|◀</button>
      <button class="nav-btn" onclick="goToMove(currentStep - 1)">◀</button>
      <button class="nav-btn" onclick="goToMove(currentStep + 1)">▶</button>
      <button class="nav-btn" onclick="goToMove(currentMoves.length)">▶|</button>
      <button class="play-sandbox-btn" onclick="enableSandbox()">Play From Here</button>
    </div>

    <div class="analysis-box" id="analysis-box">
      <div class="move-status" id="status-title">Awaiting Game</div>
      <div class="move-detail" id="status-desc">Select a game from the Dashboard.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
  let gamesData = {};
  let currentMoves = [];
  let currentStep = 0;
  let isSandboxMode = false;
  const game = new Chess();
  
  const boardConfig = {
    position: 'start',
    draggable: true,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: (source, piece) => {
      if (!isSandboxMode && currentStep > 0) return false;
      const moves = game.moves({ square: source, verbose: true });
      if (moves.length === 0) return false;
      highlightSquares(source, moves);
    },
    onDrop: (source, target) => {
      removeHighlights();
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      board.position(game.fen());
    }
  };

  const board = Chessboard('board', boardConfig);

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
    if (tabId === 'analysis') board.resize();
  }

  document.getElementById('load-btn').addEventListener('click', async () => {
    const dbUrl = document.getElementById('db-url').value;
    const user = document.getElementById('username').value;
    const res = await fetch(`${dbUrl}/users/${user}/games.json`);
    gamesData = await res.json();
    
    const listEl = document.getElementById('game-list');
    listEl.innerHTML = '';
    Object.keys(gamesData).reverse().forEach(id => {
      const g = gamesData[id];
      if (!g.moves) return;
      const card = document.createElement('div');
      card.className = 'game-card';
      card.onclick = () => loadGame(id);
      card.innerHTML = `<div class="game-title">Match: ${g.white || 'White'} vs ${g.black || 'Black'}</div><div class="game-meta">${g.moves.length} moves</div>`;
      listEl.appendChild(card);
    });
    alert("Games synced successfully!");
  });

  function loadGame(id) {
    const meta = gamesData[id];
    currentMoves = meta.moves;
    isSandboxMode = false;
    
    document.getElementById('white-player').innerText = `W: ${meta.white || 'Player'}`;
    document.getElementById('black-player').innerText = `B: ${meta.black || 'Player'}`;
    document.getElementById('white-acc').innerText = meta.white_accuracy || "N/A";
    document.getElementById('black-acc').innerText = meta.black_accuracy || "N/A";

    switchTab('analysis');
    document.querySelectorAll('.tab-btn')[0].classList.remove('active');
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    goToMove(0);
  }

  function goToMove(index) {
    isSandboxMode = false;
    if (index < 0 || index > currentMoves.length) return;
    currentStep = index;

    if (currentStep === 0) {
      game.reset();
      board.position(game.fen());
      updateEvalBar(0);
      document.getElementById('status-title').innerText = "Start of Game";
      document.getElementById('status-desc').innerText = "Step through or click Play From Here.";
      return;
    }

    const moveData = currentMoves[currentStep - 1];
    game.load(moveData.fen_before);
    game.move(moveData.played, { sloppy: true });
    board.position(game.fen());
    updateEvalBar(moveData.eval_cp || 0);

    const title = document.getElementById('status-title');
    const desc = document.getElementById('status-desc');
    const classification = moveData.classification || "Good";

    if (classification === "Blunder") {
      title.innerText = "✗ Blunder";
      desc.innerText = `Played: ${moveData.played} | Best: ${moveData.best_move}`;
    } else {
      title.innerText = "✓ " + classification;
      desc.innerText = `Played: ${moveData.played}`;
    }
  }

  function enableSandbox() {
    isSandboxMode = true;
    document.getElementById('status-title').innerText = "🎮 Sandbox Active";
    document.getElementById('status-desc').innerText = "Drag pieces freely to test custom variations.";
  }

  function updateEvalBar(cp) {
    // Map centipawn evaluation (-500 to +500) to visual height percentage (5% to 95%)
    let winChance = 50 + (cp / 10);
    winChance = Math.max(5, Math.min(95, winChance));
    document.getElementById('eval-fill').style.height = winChance + "%";
  }

  function highlightSquares(source, moves) {
    $('#board .square-55d63').removeClass('highlight-square');
    $('#board .square-' + source).addClass('highlight-square');
    moves.forEach(m => $('#board .square-' + m.to).addClass('highlight-square'));
  }

  function removeHighlights() {
    $('#board .square-55d63').removeClass('highlight-square');
  }
</script>
</body>
</html>
