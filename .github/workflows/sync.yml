name: Chess Auto-Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  analyze-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests python-chess firebase-admin google-auth

      - name: Install Stockfish Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          which stockfish

      - name: Run Analyzer Script
        env:
          CHESS_COM_USERNAME: "forgotten_gambit"
          FIREBASE_DB_URL: "https://chess-analyzer-36eb6-default-rtdb.firebaseio.com"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python analyzer.py
        
