name: Sync & Analyze Games

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger too

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_RELEASE: sf_18  # pin the engine version here
      ANALYSIS_DEPTH: 14
      SYNC_MONTHS: 1
      MAX_GAMES_PER_RUN: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish (pinned official release)
        run: |
          curl -L -o stockfish.tar \
            "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_RELEASE}/stockfish-ubuntu-x86-64-avx2.tar"
          tar -xf stockfish.tar
          sudo mv stockfish/stockfish-ubuntu-x86-64-avx2 "$STOCKFISH_PATH"
          sudo chmod +x "$STOCKFISH_PATH"
          "$STOCKFISH_PATH" --help || true  # sanity check it runs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess requests firebase-admin

      - name: Run analyzer
        run: python analyzer.py
