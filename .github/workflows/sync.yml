name: Sync & Analyze Games

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sync_months:
        description: "How many months of chess.com history to scan this run"
        type: string
        default: "1"

concurrency:
  group: sync-analyze-games
  cancel-in-progress: false   # queue instead of overwriting an in-progress run

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CHESSCOM_ACCOUNTS: ${{ secrets.CHESSCOM_ACCOUNTS }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_RELEASE: sf_19  # pin the engine version here
      ANALYSIS_DEPTH: 25
      ANALYSIS_TIME_LIMIT: 8.0
      ANALYSIS_MULTIPV: 3
      # Defaults to "1" month on the scheduled cron runs.
      # A manual "Run workflow" trigger can override it via the input above.
      SYNC_MONTHS: ${{ github.event.inputs.sync_months || '1' }}
      MAX_GAMES_PER_RUN: 3

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Stockfish binary
        id: cache-stockfish
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/stockfish
          key: stockfish-${{ env.STOCKFISH_RELEASE }}-v2

      - name: Install Stockfish (pinned official release)
        if: steps.cache-stockfish.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y jq

          # Don't hardcode the asset filename — Stockfish has renamed assets
          # between releases (e.g. sf_19 moved to "universal binaries" and
          # dropped the old per-CPU-variant naming). Resolve the real
          # download URL from the release's actual asset list instead.
          API_URL="https://api.github.com/repos/official-stockfish/Stockfish/releases/tags/${STOCKFISH_RELEASE}"

          echo "Fetching release metadata: $API_URL"
          ASSETS_JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")

          ASSET_URL=$(echo "$ASSETS_JSON" \
            | jq -r '.assets[]?.browser_download_url' \
            | grep -iE 'linux.*(x86[-_]?64|amd64)' \
            | grep -v '\.sha256' \
            | head -n1)

          if [ -z "${ASSET_URL:-}" ] || [ "$ASSET_URL" = "null" ]; then
            echo "::error::Could not find a Linux x86-64 asset for release ${STOCKFISH_RELEASE}"
            echo "Available assets were:"
            echo "$ASSETS_JSON" | jq -r '.assets[]?.name'
            exit 1
          fi

          echo "Resolved asset URL: $ASSET_URL"
          curl -fL -o stockfish.archive "$ASSET_URL"

          # Sanity-check we actually got an archive, not an error page.
          file stockfish.archive
          SIZE=$(stat -c%s stockfish.archive)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Downloaded file is suspiciously small ($SIZE bytes) — likely not a real archive"
            cat stockfish.archive || true
            exit 1
          fi

          mkdir -p sf_extracted
          tar -xf stockfish.archive -C sf_extracted

          # Don't hardcode the extracted binary's filename either — find the
          # actual executable inside the extracted tree.
          BIN_PATH=$(find sf_extracted -type f -executable | head -n1)
          if [ -z "${BIN_PATH:-}" ]; then
            echo "::error::No executable found inside the extracted archive"
            find sf_extracted -maxdepth 3
            exit 1
          fi

          echo "Found binary: $BIN_PATH"
          sudo mv "$BIN_PATH" "$STOCKFISH_PATH"
          sudo chmod +x "$STOCKFISH_PATH"

      - name: Sanity-check Stockfish
        run: |
          "$STOCKFISH_PATH" --help || true
          printf 'uci\nquit\n' | "$STOCKFISH_PATH" | grep -i "id name" || true
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess requests firebase-admin

      - name: Run analyzer
        run: python analyzer.py
